{% extends "admin/login.html" %}
{% load i18n security %}

{% block content %}
    {% settings_value "LOGIN_ENABLED" as login_enabled %}
    {% settings_value "DEBUG" as debug %}
    {% if debug or login_enabled %}
        {{ block.super }}
    {% endif %}
    <form action="{% ad_backend %}" method="post">
        {% csrf_token %}
        <button type="submit" class="button" style="width: 100%; text-align: center; box-sizing: border-box; margin-top: 10px; cursor: pointer;">{% translate "Login with Azure" %}</button>
    </form>
{% endblock content %}
